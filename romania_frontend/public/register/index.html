<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        href="styles.css"
        rel="stylesheet"
    >

    <title>Registration Page</title>

</head>

<body>

    <div class="main-container">


        <!-- =====================================================
             LEFT CONTAINER
             ===================================================== -->

        <div class="title-container">

            <h1 class="page-title">
                Romanian Map
            </h1>

        </div>


        <!-- =====================================================
             RIGHT CONTAINER
             ===================================================== -->

        <div class="container">


            <!-- BACK TO HOME -->

            <a href="/main_page" class="back-home">
                ← Back to Home
            </a>


            <form class="form-field" id="register-form">


                <!-- TITLE -->

                <h1 class="heading">
                    Create an account
                </h1>


                <p class="p-text">
                    The algorithm searches for a path from
                    the start city to the goal city
                </p>


                <!-- =================================================
                     INPUT FIELDS
                     ================================================= -->

                <div class="input-field-box">


                    <!-- USERNAME -->

                    <label for="username">
                        Username
                    </label>

                    <input
                        class="input-field"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Your Username"
                        required
                    >


                    <!-- EMAIL -->

                    <label for="email">
                        Email
                    </label>

                    <input
                        class="input-field"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Your email"
                        required
                    >


                    <!-- PASSWORD -->

                    <label for="password">
                        Password
                    </label>

                    <input
                        class="input-field"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your Password"
                        required
                    >


                    <!-- CONFIRM PASSWORD -->

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        class="input-field"
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Your Password"
                        required
                    >

                </div>


                <!-- =================================================
                     CREATE ACCOUNT BUTTON
                     ================================================= -->

                <button
                    class="btn"
                    type="submit"
                >
                    Create an Account
                </button>


                <!-- =================================================
                     GMAIL ICON
                     ================================================= -->

                <div class="img-container">

                    <img
                        src="https://images.icon-icons.com/2642/PNG/512/google_mail_gmail_logo_icon_159346.png"
                        alt="Google Mail"
                    >

                </div>


                <!-- =================================================
                     LOGIN LINK
                     ================================================= -->

                <p class="to-login">

                    Already have an account?

                    <a href="/login/index.html">
                        Login
                    </a>

                </p>


            </form>

        </div>

    </div>
    <script>
        document.getElementById("register-form").addEventListener("submit", async function (event) {
            event.preventDefault();
    
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
    
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }
    
            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });
    
                const data = await response.json();
    
                if (!response.ok) {
                    alert(data.error || "Registration failed");
                    return;
                }
    
                alert("Account created successfully!");
    
                window.location.href = "/login/index.html";
            } catch (error) {
                console.error(error);
                alert("Could not connect to the server.");
            }
        });
    </script>
</body>

</html>
