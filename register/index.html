<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title>Registration Page</title>
</head>

<body>

    <div class="main-container">

        <!-- Left Container -->
        <div class="title-container">
            <h1 class="page-title">Romanian Map</h1>
        </div>


        <!-- Right Container -->
        <div class="container">

            <form class="form-field">

                <h1 class="heading">Create an account</h1>
                <p class="p-text">The algorithm searches for a path from the start city to the goal city</p>

                <!-- Input fields -->
                <div class="input-field-box">

                    <label for="username">Username</label>
                    <input
                        class="input-field"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Your Username"
                        required
                    >

                    <label for="email">Email</label>
                    <input 
                    class="input-field"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Your email"
                    required
                    >

                    <label for="password">Password</label>
                    <input
                        class="input-field"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your Password"
                        required
                    >

                    <label for="confirm-password">Confirm Password</label>
                    <input
                    class="input-field"
                    name="confirm-password"
                    id="confirm-password"
                    placeholder="Your Password"
                    required>

                </div>

                <button class="btn" type="submit">
                    Create an Account
                </button>

                <!-- Gmail icon -->
                <div class="img-container">
                    <img
                        src="https://images.icon-icons.com/2642/PNG/512/google_mail_gmail_logo_icon_159346.png"
                        alt="Google Mail"
                    >
                </div>

                <p class="to-login">
                    Already have an account?
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </div>

</body>
</html>
