<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="portview" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title></title>
</head>
<body>
    <div class="container">
    <form class="form-field">
        <h1 class="heading">USER LOGIN</h1>
        <p class="p-text">Welcome to Romanian Map</p>
        <!-- Input Field Section-->
        <div class="input-field-box">
            <label for="username">Username</label>
            <input class="input-field" type="text" 
            id="username" 
            name="username" 
            placeholder="Your Username" 
            required>
            <label for="password">Password</label>
            <input  class="input-field" type="text" 
            id="password" 
            name="password" 
            placeholder="Your password" 
            required>
        </div>
        <!-- Input Field Section -->
        <button class="btn" type="submit" id="submit" name="submit">LOGIN</button>
        <div class="img-container">
            <img src="https://images.icon-icons.com/2642/PNG/512/google_mail_gmail_logo_icon_159346.png" alt="googlemail">
    
        </div>
        <p class="to-register">Don't have an account? <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Register</a></p>
    </form>
    </div>

</body>
</html>
